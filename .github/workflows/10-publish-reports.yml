name: 发布报告到 Pages

# 作用：每次「每日股票分析」跑成功后，把 reports/*.md 转成排版好的 HTML，
# 追加发布到 gh-pages 分支，历史报告永久累积。
# 网页地址：https://<你的用户名>.github.io/daily_stock_analysis/

on:
  workflow_run:
    workflows: ["每日股票分析"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: '要发布的「每日股票分析」运行 ID（留空则只刷新站点，不导入报告）'
        required: false
        default: ''

concurrency:
  group: publish-reports
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 下载本次分析产物
        if: github.event_name == 'workflow_run' || inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: analysis-reports-*
          merge-multiple: true
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: 恢复历史报告
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" _old
            rm -f _old/index.html
            cp -r _old/. site/ 2>/dev/null || true
            rm -rf site/.git
            echo "已恢复 $(ls site | wc -l) 个历史文件"
          else
            echo "首次发布，gh-pages 尚不存在"
          fi

      - name: 写入样式表
        run: |
          if [ ! -f site/style.css ]; then
          cat > site/style.css <<'CSS'
          :root { color-scheme: light; }
          * { box-sizing: border-box; }
          body { margin: 0; padding: 28px 14px 70px; background: #f5f6f8; color: #24292f;
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            line-height: 1.75; font-size: 16px; }
          .page { max-width: 940px; margin: 0 auto; background: #fff; border-radius: 14px;
            padding: 34px 40px 50px; box-shadow: 0 6px 28px rgba(15,23,42,.08); }
          nav { margin-bottom: 18px; font-size: 14px; }
          nav a { color: #2563eb; text-decoration: none; }
          h1 { font-size: 25px; margin: 0 0 6px; padding-bottom: 12px; border-bottom: 3px solid #2563eb; }
          h2 { font-size: 20px; margin: 34px 0 12px; padding: 8px 0 8px 12px; border-left: 5px solid #2563eb;
            background: linear-gradient(90deg,#eff6ff,transparent); border-radius: 0 6px 6px 0; }
          h3 { font-size: 17px; margin: 24px 0 9px; color: #1e40af; }
          h4 { font-size: 15.5px; margin: 18px 0 8px; color: #334155; }
          p { margin: 10px 0; }
          blockquote { margin: 15px 0; padding: 12px 18px; background: #f8fafc;
            border-left: 4px solid #94a3b8; border-radius: 0 8px 8px 0; color: #475569; }
          ul, ol { margin: 10px 0; padding-left: 24px; }
          li { margin: 6px 0; }
          hr { border: none; border-top: 1px dashed #cbd5e1; margin: 26px 0; }
          table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px;
            display: block; overflow-x: auto; }
          th, td { border: 1px solid #e2e8f0; padding: 8px 11px; text-align: left; white-space: nowrap; }
          th { background: #f1f5f9; font-weight: 600; }
          tbody tr:nth-child(even) { background: #fafcff; }
          code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #b91c1c; font-size: 14px; }
          .footer { margin-top: 42px; padding-top: 14px; border-top: 1px solid #e2e8f0;
            font-size: 13px; color: #94a3b8; text-align: center; }
          .card { display: flex; align-items: center; justify-content: space-between; gap: 12px;
            border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 18px; margin: 12px 0;
            background: #fff; transition: .15s; }
          .card:hover { box-shadow: 0 4px 16px rgba(37,99,235,.12); border-color: #bfdbfe; }
          .date { font-size: 17px; font-weight: 600; color: #0f172a; }
          .links { display: flex; gap: 8px; flex-wrap: wrap; }
          .btn { display: inline-block; padding: 7px 14px; border-radius: 9px; text-decoration: none;
            font-size: 14px; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
          .btn.market { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
          .btn:hover { filter: brightness(.96); }
          .empty { color: #94a3b8; text-align: center; padding: 40px 0; }
          @media print { body { background: #fff; padding: 0; }
            .page { box-shadow: none; max-width: none; padding: 0; } }
          CSS
          fi
          touch site/.nojekyll

      - name: Markdown 转 HTML
        run: |
          python3 -m pip install --quiet markdown
          python3 - <<'PY'
          import pathlib, datetime, markdown

          art = pathlib.Path("artifact")
          srcs = sorted(p for p in art.rglob("*.md") if p.parent.name == "reports") if art.exists() else []
          out = pathlib.Path("site")
          out.mkdir(parents=True, exist_ok=True)

          def render(title, body):
              stamp = datetime.datetime.now().strftime("%Y-%m-%d %H:%M")
              return f"""<!DOCTYPE html>
          <html lang="zh-CN"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>{title}</title><link rel="stylesheet" href="style.css"></head>
          <body><div class="page">
          <nav><a href="index.html">← 全部报告</a></nav>
          {body}
          <div class="footer">daily_stock_analysis · 生成于 {stamp} · 仅供学习研究，不构成投资建议</div>
          </div></body></html>"""

          n = 0
          if srcs:
              for f in srcs:
                  text = f.read_text(encoding="utf-8")
                  body = markdown.markdown(text, extensions=["tables", "fenced_code", "sane_lists"])
                  name = f.stem
                  if name.startswith("market_review_"):
                      name = "market_" + name[len("market_review_"):]
                  (out / (name + ".html")).write_text(render(f.stem, body), encoding="utf-8")
                  n += 1
          print(f"转换 {n} 个报告")
          PY

      - name: 生成首页
        run: |
          python3 - <<'PY'
          import pathlib, re, collections

          site = pathlib.Path("site")
          items = collections.defaultdict(list)
          for f in site.glob("*.html"):
              if f.name == "index.html":
                  continue
              m = re.search(r"(\d{8})", f.stem)
              if m:
                  items[m.group(1)].append(f.name)

          rows = []
          for date in sorted(items, reverse=True):
              d = f"{date[:4]}-{date[4:6]}-{date[6:]}"
              links = []
              for name in sorted(items[date]):
                  if name.startswith("market_"):
                      links.append(f'<a class="btn market" href="{name}">📉 大盘复盘</a>')
                  else:
                      links.append(f'<a class="btn" href="{name}">📈 个股分析</a>')
              rows.append(f'<div class="card"><div class="date">{d}</div>'
                          f'<div class="links">{"".join(links)}</div></div>')

          body = "\n".join(rows) if rows else '<div class="empty">还没有报告，等待第一次分析运行完成</div>'
          page = f"""<!DOCTYPE html>
          <html lang="zh-CN"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>每日股票分析 · 报告归档</title><link rel="stylesheet" href="style.css"></head>
          <body><div class="page">
          <h1>📈 每日股票分析 · 报告归档</h1>
          <p>共 {len(items)} 个交易日。每个工作日 18:00（北京时间）自动更新。</p>
          {body}
          <div class="footer">daily_stock_analysis · 仅供学习研究，不构成投资建议</div>
          </div></body></html>"""
          (site / "index.html").write_text(pa
